<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Constella</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Mise en page : carte plein écran sur canvas, HUD flottant en haut (score, vitesse) et en bas (envoi, étoile) */
:root{
  --void:#0a0c1b; --void2:#12153a; --ink:#ecebf7; --muted:#8f8db0; --panel:rgba(18,20,44,.88); --edge:#2a2e5a;
  --me:#3ee07a; --foe:#ff5a3c; --foe2:#b18cff; --foe3:#ff5fa2; --neutral:#a29fc2; --gold:#f2c14e; --shield:#bfe6ff;
  --display:"Chakra Petch","Noto Sans Arabic",ui-sans-serif,system-ui,sans-serif; --body:"IBM Plex Sans","Noto Sans Arabic",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
[dir="rtl"] .rules{padding-left:0;padding-right:18px}
[dir="rtl"] #top,[dir="rtl"] #bottom,[dir="rtl"] .seg{direction:ltr}
[dir="rtl"] #fitBtn{right:auto;left:max(12px,env(safe-area-inset-left,0px))}
#lang button{min-width:38px}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.hud{position:absolute;left:0;right:0;display:flex;gap:10px;align-items:center;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
#top{top:0;padding-block:10px;justify-content:space-between;flex-wrap:wrap}
#bottom{bottom:0;padding-block:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));flex-direction:column;align-items:stretch;gap:8px}
.chip{background:var(--panel);border:1px solid var(--edge);border-radius:10px;backdrop-filter:blur(6px)}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--muted);padding:8px 10px}
.score{display:flex;align-items:center;gap:8px;padding:6px 10px;font-family:var(--display);font-variant-numeric:tabular-nums;font-size:14px;flex:1;min-width:150px;max-width:360px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--edge);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.me{color:var(--me)} .foe{color:var(--foe)}
.seg{display:flex;padding:3px;gap:2px}
.seg button{padding:6px 9px;border-radius:7px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);min-width:34px}
.seg button[aria-pressed="true"]{background:var(--edge);color:var(--ink)}
.row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
#ratio{align-items:center}
#hint{flex:1 1 220px;padding:9px 12px;font-size:13px;color:var(--muted);min-width:0;display:flex;align-items:center}
#panel{flex:1 1 340px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
#pName{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em}
#pInfo{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pTitle{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.act{border:1px solid var(--edge);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:88px}
.act b{font-family:var(--display);font-size:13px}
.act small{color:var(--muted);font-variant-numeric:tabular-nums}
.act:disabled{opacity:.4;cursor:default}
.act[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.act.fast{border-color:rgba(62,224,122,.45)} .act.shield{border-color:rgba(191,230,255,.45)} .act.beacon{border-color:rgba(242,193,78,.45)}
.st{color:var(--gold);font-size:12px;letter-spacing:1px;line-height:1}
#endStars{font-size:44px;color:var(--gold);letter-spacing:6px;margin:0;line-height:1}
#endGoals{color:var(--muted);margin:0;font-size:13.5px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 4px 0 8px;display:flex;align-items:center}
#tuto{position:absolute;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));padding:10px 14px;display:flex;flex-direction:column;gap:6px;border-color:rgba(242,193,78,.55);box-shadow:0 0 0 1px rgba(242,193,78,.15),0 8px 30px rgba(0,0,0,.4)}
#tutoN{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#tutoT{margin:0;font-size:14px;line-height:1.4}
#tuto .tb{display:flex;gap:8px;justify-content:flex-end;align-items:center}
#tutoSkip{font-size:12.5px;color:var(--muted);padding:6px 8px}
#tutoOk{background:var(--gold);color:#241a02;font-family:var(--display);font-weight:700;padding:7px 14px;border-radius:9px}
.icon{padding:7px 9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icon svg{width:20px;height:20px;display:block}
.icon[aria-pressed="false"]{color:var(--foe)}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);max-width:min(420px,calc(100% - 32px));padding:6px 12px;text-align:center;font-size:12.5px;line-height:1.35;color:var(--muted);pointer-events:none;transition:opacity .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Icônes autour de l'étoile sélectionnée */
#ring{position:absolute;inset:0;pointer-events:none}
.rb{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(14,16,38,.94);border:1.5px solid var(--edge);display:flex;align-items:center;justify-content:center;pointer-events:auto;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.45);padding:0}
.rb svg{width:20px;height:20px;display:block}
.rb i{font-style:normal;font-family:var(--display);font-weight:700;font-size:10px;line-height:1;position:absolute}
.rb .c{bottom:-8px;left:50%;transform:translateX(-50%);background:#0b0d22;border:1px solid var(--edge);border-radius:6px;padding:2px 4px;color:var(--gold)}
.rb .lv{top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#241a02;display:flex;align-items:center;justify-content:center}
.rb:disabled{opacity:.4;cursor:default}
.rb[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.k-rapide,.kk-rapide{color:var(--me)!important;border-color:rgba(62,224,122,.6)!important}
.k-bouclier,.kk-bouclier{color:var(--shield)!important;border-color:rgba(191,230,255,.6)!important}
.k-phare,.kk-phare{color:var(--gold)!important;border-color:rgba(242,193,78,.6)!important}
.k-prod{color:var(--gold)}
#help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;border-color:rgba(242,193,78,.55)}
#help .ni .rb{width:36px;height:36px}
#helpOk{background:var(--gold);color:#241a02;font-family:var(--display);font-weight:700;padding:9px;border-radius:10px;position:sticky;bottom:0}
#helpH{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.rb.pulse{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(242,193,78,.45),0 0 18px rgba(242,193,78,.7);animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 7px rgba(242,193,78,.25),0 0 26px rgba(242,193,78,.9)}}
#news{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));padding:14px;display:flex;flex-direction:column;gap:10px;border-color:rgba(242,193,78,.55)}
#newsH{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ni{display:flex;gap:12px;align-items:center}
.ni .rb{position:relative;margin:0;flex:0 0 auto;pointer-events:none}
.ni b{display:block;font-family:var(--display);font-size:15px}
.ni small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
#newsOk{background:var(--gold);color:#241a02;font-family:var(--display);font-weight:700;padding:9px;border-radius:10px}
#fitBtn{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px))}
#toast b{font-family:var(--display);letter-spacing:.06em;display:block;font-size:15px;margin-bottom:2px}
/* Écrans */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,9,22,.8);backdrop-filter:blur(4px);overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px;margin:auto}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,68px);letter-spacing:.14em;line-height:1;margin:0}
.logo span{color:var(--me)}
.tag{color:var(--muted);margin:-8px 0 0;font-size:15px;max-width:46ch}
h2{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.map{text-align:left;padding:12px;border:1px solid var(--edge);border-radius:12px;background:var(--void2);display:flex;flex-direction:column;gap:4px}
.map b{font-family:var(--display);font-size:16px}
.map small{color:var(--muted);font-size:12.5px}
.map[aria-pressed="true"]{border-color:var(--me);box-shadow:0 0 0 1px var(--me) inset}
.go{background:var(--me);color:#06201b;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.08em;padding:14px;border-radius:12px}
.go small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;letter-spacing:0;opacity:.8;margin-top:2px}
.ghost{border:1px solid var(--edge);border-radius:12px;padding:12px;font-family:var(--display);font-weight:600}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.55;display:grid;gap:2px}
.rules b{color:var(--ink);font-weight:600}
#endTitle{font-family:var(--display);font-size:clamp(34px,9vw,54px);margin:0;letter-spacing:.08em}
#endStats{color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
#menu{background:rgba(8,9,22,.55)}
.home{align-items:center;text-align:center;max-width:420px;gap:14px}
.home .tag{margin:-6px 0 0}
.hlogo{width:88px;height:88px;filter:drop-shadow(0 0 14px rgba(62,224,122,.35))}
.home .btns{width:100%;margin-top:18px;flex-direction:column}
.go.play{padding:18px;border-radius:18px;font-size:26px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 36px rgba(62,224,122,.4)}
.go.play>span{text-transform:uppercase;letter-spacing:.1em}
.go.play small{font-family:var(--body,inherit);font-size:13px;font-weight:500;letter-spacing:0;opacity:.8}
.lvl{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:2px 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:4px}
.tile{background:rgba(16,19,43,.78);border:1px solid var(--edge);border-radius:16px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:13px}
.tile svg{width:28px;height:28px}
.mtop{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;display:flex;gap:8px;z-index:2}
[dir="rtl"] .mtop{right:auto;left:14px}
.mi{height:40px;min-width:40px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:600;font-size:14px}
.mi svg{width:20px;height:20px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:82%;overflow:auto;z-index:4;background:rgba(14,17,38,.98);border-top:1px solid rgba(242,193,78,.5);border-radius:22px 22px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet h3{margin:0;font-family:var(--display);color:var(--gold);letter-spacing:.16em;font-size:13px;text-transform:uppercase}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>*{flex:1}
details.free{border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
details.free summary{cursor:pointer;font-family:var(--display);font-weight:600;letter-spacing:.06em}
details.free[open] summary{margin-bottom:12px}
details.free>div{display:flex;flex-direction:column;gap:14px}
/* Mondes */
.world{border:1px solid var(--edge);border-radius:14px;padding:14px;background:var(--void2);display:flex;flex-direction:column;gap:10px}
.world.locked{opacity:.5}
.wh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wh b{font-family:var(--display);font-size:17px;letter-spacing:.03em}
.wh .num{color:var(--muted);font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:2px}
.foes{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.foes i{width:10px;height:10px;border-radius:50%;display:inline-block}
.world p{margin:0;color:var(--muted);font-size:13px}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv button{border:1px solid var(--edge);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--void);min-width:0}
.lv button b{font-family:var(--display);font-size:16px}
.lv button small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv button.done{border-color:rgba(62,224,122,.5)} .lv button.done small{color:var(--me)}
.lv button.next{border-color:var(--me);box-shadow:0 0 0 1px var(--me) inset}
.lv button:disabled{opacity:.45;cursor:default}
@media (max-width:560px){ .brand{padding:7px 8px;font-size:12px;letter-spacing:.04em} #top{gap:6px} .seg button{padding:6px 5px;min-width:30px} #menuBtn{padding:8px 10px!important} #toast{top:104px} .score{min-width:120px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" data-i18n-aria="map_aria" aria-label="Carte de la galaxie"></canvas>

  <div class="hud" id="top">
    <div class="chip brand" id="brand">CONSTELLA</div>
    <div class="chip score" aria-live="polite">
      <span class="me" id="sMe">0</span>
      <div class="bar" id="bar"></div>
      <span class="foe" id="sFoe">0</span>
    </div>
    <div class="chip seg" id="speed" role="group" data-i18n-aria="speed_aria" aria-label="Vitesse du jeu">
      <button data-s="0" data-i18n-aria="pause" title="Pause">II</button>
      <button data-s="0.5" aria-pressed="true">½×</button>
      <button data-s="1">1×</button>
      <button data-s="1.5">1,5×</button>
      <button data-s="2">2×</button>
      <button data-s="3">3×</button>
    </div>
    <button class="chip icon" id="helpBtn" data-i18n-aria="help_h" aria-label="Aide" title="Aide"><b style="font-family:var(--display);font-size:16px;width:20px;line-height:20px;text-align:center">?</b></button>
    <button class="chip icon" id="sndBtn" aria-label="Son" aria-pressed="true" title="Couper ou remettre le son"></button>
    <button class="chip" id="menuBtn" data-i18n="menu" style="padding:8px 12px;font-family:var(--display);font-weight:600">Menu</button>
  </div>

  <div class="chip" id="toast" hidden></div>
  <div class="chip" id="tuto" hidden role="status"><span id="tutoN"></span><p id="tutoT"></p>
    <div class="tb"><button id="tutoSkip" data-i18n="tuto_skip">Passer le tutoriel</button><button id="tutoOk" hidden>OK</button></div></div>

  <div class="hud" id="bottom">
    <div class="row">
      <div class="chip seg" id="ratio" role="group" data-i18n-aria="ratio_aria" aria-label="Part de la flotte envoyée">
        <span class="lbl" data-i18n="send">Envoi</span>
        <button data-r="0.25">25%</button>
        <button data-r="0.5">50%</button>
        <button data-r="1" aria-pressed="true">100%</button>
      </div>
    </div>
  </div>
  <button class="chip icon" id="fitBtn" hidden data-i18n-aria="fit" aria-label="Recentrer la carte" title="Recentrer la carte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <div id="ring" hidden></div>
  <div class="chip" id="help" hidden role="dialog"><span id="helpH" data-i18n="help_h">Aide</span><div id="helpL" style="display:flex;flex-direction:column;gap:12px"></div><button id="helpOk" data-i18n="help_close">Fermer</button></div>
  <div class="chip" id="news" hidden role="dialog" data-i18n-aria="news_aria" aria-label="Nouveauté"><span id="newsH" data-i18n="news_h">Nouveau</span><div id="newsL" style="display:flex;flex-direction:column;gap:10px"></div><button id="newsOk" data-i18n="news_ok">Compris</button></div>

    </div>
  </div>

  <div class="screen" id="menu">
    <div class="mtop"><button class="chip mi" id="mLang" data-i18n-aria="lang_h" aria-label="Langue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg><span id="mLangL">FR</span></button><button class="chip mi" id="mSnd"></button></div>
    <div class="card home">
      <svg class="hlogo" viewBox="0 0 100 100" aria-hidden="true"><path d="M27 70L50 30M50 30L75 62M27 70L75 62" stroke="var(--me)" stroke-width="3" stroke-dasharray="6 4" fill="none"/><g fill="#10132b" stroke-width="4"><circle cx="27" cy="70" r="11" stroke="var(--me)"/><circle cx="75" cy="62" r="9" stroke="#ff5a3c"/><circle cx="50" cy="30" r="14" stroke="var(--me)"/></g></svg>
      <h1 class="logo">CONST<span>E</span>LLA</h1>
      <p class="tag" data-i18n="tag"></p>
      <div class="btns"><button class="go play" id="campaign"><span data-i18n="play">Jouer</span><small id="campNext"></small></button><button class="ghost" id="resume" hidden data-i18n="resume">Reprendre</button></div>
      <div class="tiles">
        <button class="tile" data-sheet="sFree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="7" r="3"/><circle cx="17" cy="18" r="2"/><path d="M8.5 15l7-6M9 17.5h6"/></svg><span data-i18n="free">Partie libre</span></button>
        <button class="tile" data-sheet="sHow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg><span data-i18n="how_h">Comment jouer</span></button>
        <button class="tile" data-sheet="sSet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-i18n="settings">Réglages</span></button>
      </div>
    </div>
    <div class="sheetbg" id="sheetBg" hidden></div>
    <div class="sheet" id="sFree" hidden><h3 data-i18n="free">Partie libre</h3>
      <div><h2 data-i18n="map">Carte</h2><div class="maps" id="maps"></div></div>
      <div><h2 data-i18n="opponent">Adversaire</h2>
            <div class="chip seg" id="diff" role="group" data-i18n-aria="diff_aria" aria-label="Difficulté" style="display:inline-flex">

function mkNode(id,x,y,size,owner,ships){return {id,x,y,size,owner,ships,prod:0,def:0,kind:null,klv:0,wall:0,rally:null,pulse:0};}
function finalize(W,H,nodes,edgeList,players,cfg,seed){
  const adj=nodes.map(()=>[]),edges=[];
  for(const[a,b]of edgeList){const len=Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);adj[a].push({to:b,len});adj[b].push({to:a,len});edges.push([a,b]);}
  const names=NAMES.slice();let s=seed||3;for(let i=names.length-1;i>0;i--){s=(s*16807)%2147483647;const j=s%(i+1);[names[i],names[j]]=[names[j],names[i]];}
  nodes.forEach((n,i)=>n.name=names[i%names.length]);
  return {W,H,nodes,adj,edges,players,fleets:[],fx:[],time:0,aiT:{},over:false,sel:null,relayMode:false,captured:0,cfg};
}
function buildFree(key,cfg){
  const M=MAPS[key],N=M.half.length,nodes=[];
  const mk=(x,y,size,owner,vi)=>nodes.push(mkNode(nodes.length,x,y,size,owner,owner?20:6+size*5+((vi*7)%5)));
  M.half.forEach((h,i)=>mk(h[0],h[1],h[2],h[3]?1:0,i));
  M.half.forEach((h,i)=>mk(W0-h[0],H0-h[1],h[2],h[3]?2:0,i));
  M.center.forEach((c,i)=>mk(c[0],c[1],c[2],0,i+3));
  const idx=t=>t[0]==="C"?2*N+(+t.slice(1)):t.endsWith("'")?N+(+t.slice(0,-1)):+t;
  const mir=i=>i<N?i+N:i<2*N?i-N:i;
  const seen=new Set(),list=[];
  const add=(a,b)=>{const k=a<b?a+"-"+b:b+"-"+a;if(seen.has(k)||a===b)return;seen.add(k);list.push([a,b]);};
  M.links.forEach(l=>{const[a,b]=l.split("-").map(idx);add(a,b);add(mir(a),mir(b));});
  return finalize(W0,H0,nodes,list,2,cfg,key.length*7);
}

// Générateur de cartes équitables : un secteur tiré au hasard (graine fixe), recopié par rotation pour chaque joueur
function segCross(a,b,c,d){
  const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));
  if(a===c||a===d||b===c||b===d)return false;
  return o(a,b,c)!==o(a,b,d)&&o(c,d,a)!==o(c,d,b)&&o(a,b,c)!==0&&o(c,d,a)!==0;
}
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);}
// défense des étoiles neutres selon leur catégorie : normale, 2 points, 3 points
const NEU_BASE=[0,6,14,26];
function genLevel(L,seed0){
  for(let attempt=0;attempt<60;attempt++){
    let seed=((seed0*9973+attempt*7919)%2147483646)+1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;rnd();
    const k=L.k,st=k===2?1.6:1,Rm=440,mg=90,W=Math.round(2*Rm*st+2*mg),H=2*Rm+2*mg,cx=W/2,cy=H/2,rot0=k===2?Math.PI:Math.PI/2;
    const pos=(a,r,s)=>{const ang=rot0+s*2*Math.PI/k+a;return {x:cx+Math.cos(ang)*r*Rm*st,y:cy+Math.sin(ang)*r*Rm};};
    const minD=k>=4?150:k===3?160:170,sec=[{a:0,r:.9,size:3}];
    const ok=(a,r)=>{const mine=[];for(let s=0;s<k;s++)mine.push(pos(a,r,s));
      for(let i=0;i<k;i++){for(let j=i+1;j<k;j++)if(Math.hypot(mine[i].x-mine[j].x,mine[i].y-mine[j].y)<minD)return false;
        if(L.center&&Math.hypot(mine[i].x-cx,mine[i].y-cy)<minD+20)return false;
        for(const q of sec)for(let s=0;s<k;s++){const p=pos(q.a,q.r,s);if(Math.hypot(mine[i].x-p.x,mine[i].y-p.y)<minD)return false;}}
      return true;};
    for(let t=0;t<900&&sec.length<1+L.n;t++){const a=(rnd()*2-1)*Math.PI/k*.95,r=.15+rnd()*.83;if(ok(a,r)){const u=rnd();sec.push({a,r,size:Math.min(L.maxSize||3,u<.5?1:u<.82?2:3)});}}
    if(sec.length<1+L.n)continue;
    const m=sec.length,home=pos(0,.9,0);
    const order=sec.map((q,i)=>i).slice(1).sort((i,j)=>{const p=pos(sec[i].a,sec[i].r,0),q=pos(sec[j].a,sec[j].r,0);return Math.hypot(p.x-home.x,p.y-home.y)-Math.hypot(q.x-home.x,q.y-home.y);});
    const extra=new Set(order.slice(0,(L.start||1)-1));
    const neuShips=sec.map(q=>Math.round((NEU_BASE[q.size]+rnd()*5)*(L.neu||1)));
    const nodes=[];
    for(let s=0;s<k;s++)sec.forEach((q,i)=>{const p=pos(q.a,q.r,s),own=(i===0||extra.has(i))?s+1:0;
      const ships=i===0?(s===0?20:(L.aiShips||20)):own?10:neuShips[i];nodes.push(mkNode(nodes.length,p.x,p.y,i===0?Math.min(2,L.maxSize||3):q.size,own,ships));});
    const centerIdx=L.center?nodes.length:-1;
    if(L.center){const cs=Math.min(3,L.maxSize||3);nodes.push(mkNode(nodes.length,cx,cy,cs,0,Math.round((NEU_BASE[cs]+6)*(L.neu||1))));}
    const rot=(i,s)=>i===centerIdx?i:((Math.floor(i/m)+s)%k)*m+i%m;
    const cands=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);if(d<Rm*.85)cands.push([i,j,d]);}
    cands.sort((a,b)=>a[2]-b[2]);
    const E=[],keys=new Set(),deg=nodes.map(()=>0);
    const valid=(grp,strict)=>{const tmp=deg.slice();
      for(let g=0;g<grp.length;g++){const[a,b]=grp[g];
        if(strict&&(++tmp[a]>4||++tmp[b]>4))return false;
        for(const n of nodes)if(n.id!==a&&n.id!==b&&segDist(n,nodes[a],nodes[b])<34)return false;
        for(const[c,d]of E.concat(grp.slice(0,g)))if(segCross(nodes[a],nodes[b],nodes[c],nodes[d]))return false;}
      return true;};
    const group=(i,j)=>{const out=[],seenG=new Set();for(let s=0;s<k;s++){let a=rot(i,s),b=rot(j,s);if(a>b)[a,b]=[b,a];const key=a+"-"+b;if(!seenG.has(key)&&!keys.has(key)){seenG.add(key);out.push([a,b]);}}return out;};
    const addG=grp=>grp.forEach(([a,b])=>{keys.add(a+"-"+b);E.push([a,b]);deg[a]++;deg[b]++;});
    for(const[i,j]of cands){const grp=group(i,j);if(grp.length&&valid(grp,true))addG(grp);}
    const comp=()=>{const p=nodes.map((_,i)=>i),f=x=>p[x]===x?x:(p[x]=f(p[x]));E.forEach(([a,b])=>p[f(a)]=f(b));return nodes.map((_,i)=>f(i));};
    let guard=0,cc=comp();
    while(new Set(cc).size>1&&guard++<20){const c=cands.find(([i,j])=>cc[i]!==cc[j]&&valid(group(i,j),false));if(!c)break;addG(group(c[0],c[1]));cc=comp();}
    if(new Set(cc).size>1)continue;
    // recadrage sur les étoiles réellement placées, pour remplir l'écran
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;nodes.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);});
    const pad=85;nodes.forEach(n=>{n.x+=pad-x0;n.y+=pad-y0;});
    return finalize(Math.round(x1-x0+2*pad),Math.round(y1-y0+2*pad),nodes,E,k,DIFF[L.ai],seed0);
  }
  return null;
}
function levelStyles(L,li){const st={};for(let o=2;o<=L.k;o++)st[o]=L.st?L.st[(o-2)%L.st.length]:L.k===2?["prudent","agressif"][li%2]:["agressif","prudent","equilibre"][(o-2+li)%3];return st;}

function path(from,to,owner){
  const nodes=G.nodes,dist=nodes.map(()=>Infinity),prev=nodes.map(()=>-1),done=new Set();
  dist[from]=0;
  while(true){let u=-1,b=Infinity;for(let i=0;i<nodes.length;i++)if(!done.has(i)&&dist[i]<b){b=dist[i];u=i;}
    if(u<0||u===to)break;done.add(u);
    for(const e of G.adj[u]){const pen=(e.to!==to&&nodes[e.to].owner!==owner)?5000:0;const d=dist[u]+e.len+pen;if(d<dist[e.to]){dist[e.to]=d;prev[e.to]=u;}}}
  if(dist[to]===Infinity)return null;
  const p=[to];while(p[0]!==from)p.unshift(prev[p[0]]);return p;
}
function edgeLen(a,b){return G.adj[a].find(e=>e.to===b).len}
function send(n,t,count){
  if(!n||!t||n===t)return false;
  count=Math.floor(Math.min(count,n.ships));if(count<1)return false;
  const p=path(n.id,t.id,n.owner);if(!p)return false;
  n.ships-=count;G.fleets.push({owner:n.owner,ships:count,path:p,seg:0,t:0,len:edgeLen(p[0],p[1]),dest:t.id,spd:(n.kind==="rapide"?RAP[KL(n)]:1)*boostOf(n),pow:boostOf(n)});
  return true;
}
function upgrade(n,kind){
  const ok=(()=>{
  const u=U();
  if(kind==="prod"&&n.prod<u.prod&&n.ships>=prodCost(n)){n.ships-=prodCost(n);n.prod++;fx(n,C.gold);return true;}
  if(kind==="def"&&n.kind!=="rapide"&&n.def<u.def&&n.ships>=defCost(n)){n.ships-=defCost(n);n.def++;fx(n,C.gold);return true;}
  if(kind==="klv"&&n.kind&&KL(n)<u.klv&&n.ships>=klvCost(n)){n.ships-=klvCost(n);n.klv=KL(n)+1;fx(n,C.gold);return true;}
  if(KIND_NAME[kind]&&u[kind]&&!n.kind&&n.ships>=SPECIAL_COST){n.ships-=SPECIAL_COST;n.kind=kind;n.klv=1;fx(n,kind==="bouclier"?C.shield:kind==="phare"?C.gold:OWN_COL[n.owner]);return true;}
  return false;})();
  if(ok&&n.owner===1){sfx("upgrade");buzz(12);}
  return ok;
}
function fx(n,col){G.fx.push({x:n.x,y:n.y,col,t:0,seed:Math.random()*6});}
// petite explosion quand deux flottes se percutent : éclair blanc + étincelles aux deux couleurs
function boom(x,y,c1,c2,k){const sp=[];for(let i=0;i<14;i++)sp.push({a:Math.random()*6.283,v:.45+Math.random()*.6,c:i%2?c1:c2});
  G.fx.push({x,y,t:0,boom:1,size:Math.min(6,Math.log2(k+1)),sp,col:C.ink});}
function arrive(f,n){
  if(n.owner===f.owner){n.ships+=f.ships;return;}
  const pw=f.pow||1;let att=f.ships*pw;
  if(n.wall>0){const k=Math.min(n.wall,att);n.wall-=k;att-=k;if(att<=1e-6){n.pulse=1;if(n.owner===1||f.owner===1)sfx("block");return;}}
  const m=defMult(n),eff=n.ships*m;
  if(att>eff+1e-6){
    if(isAI(n.owner)&&f.owner===1)G.captured++;
    if(f.owner===1){sfx("capture");buzz(18);}else if(n.owner===1){sfx("lost");buzz([50,40,50]);}else sfx("far");
    n.owner=f.owner;n.ships=(att-eff)/pw;n.def=0;n.prod=Math.max(0,n.prod-1);n.rally=null;n.kind=null;n.klv=0;n.wall=0;
    G.nodes.forEach(o=>{if(o.rally===n.id&&o.owner!==n.owner)o.rally=null;});
    if(G.sel===n.id&&n.owner!==1)G.sel=null;
    fx(n,OWN_COL[f.owner]);
  } else n.ships=Math.max(0,(eff-att)/m);
  n.pulse=1;
}
const has=o=>G.nodes.some(n=>n.owner===o)||G.fleets.some(f=>f.owner===o);

function step(dt){
  G.time+=dt;
  for(const n of G.nodes){
    if(n.owner&&n.ships<cap(n))n.ships=Math.min(cap(n),n.ships+rate(n)*dt);
    if(n.owner&&n.wall<wallMax(n))n.wall=Math.min(wallMax(n),n.wall+dt/wallTime(n));
    n.pulse=Math.max(0,n.pulse-dt*2);
    if(n.rally!==null&&n.owner&&n.ships>=autoQty)send(n,G.nodes[n.rally],autoQty);
  }
  const alive=[];
  for(const f of G.fleets){
    f.t+=FLEET_SPEED*f.spd*dt/f.len;
    if(f.t>=1){
      const at=G.nodes[f.path[f.seg+1]];
      if(at.owner===f.owner&&f.seg+1<f.path.length-1){f.seg++;f.t=0;f.len=edgeLen(f.path[f.seg],f.path[f.seg+1]);alive.push(f);}
      else arrive(f,at);
    } else alive.push(f);
  }
  G.fleets=alive;
  for(let i=0;i<G.fleets.length;i++)for(let j=i+1;j<G.fleets.length;j++){
    const a=G.fleets[i],b=G.fleets[j];if(a.owner===b.owner||a.ships<=0||b.ships<=0)continue;
    if(a.path[a.seg]===b.path[b.seg+1]&&a.path[a.seg+1]===b.path[b.seg]&&a.t+b.t>=1){
      const k=Math.min(a.ships,b.ships);a.ships-=k;b.ships-=k;
      const px=G.nodes[a.path[a.seg]],py=G.nodes[a.path[a.seg+1]],me=a.owner===1||b.owner===1;
      boom(px.x+(py.x-px.x)*a.t,px.y+(py.y-px.y)*a.t,OWN_COL[a.owner],OWN_COL[b.owner],k);
      if(me){sfx("boom");buzz(10);}else sfx("boomFar");
    }
  }
  G.fleets=G.fleets.filter(f=>f.ships>=0.5);
  G.fx.forEach(e=>e.t+=dt);G.fx=G.fx.filter(e=>e.t<0.8);
  for(let o=G.demo?1:2;o<=G.players;o++){G.aiT[o]=(G.aiT[o]||o*.37)+dt;if(G.aiT[o]>=G.cfg.think){G.aiT[o]=0;if(has(o))ai(o);}}
  let foes=0;for(let o=2;o<=G.players;o++)if(has(o))foes++;
  if(!foes)finish(true);else if(!has(1))finish(false);
}

// IA : défend ses étoiles menacées, vise les étoiles faibles (en combinant plusieurs étoiles), puis améliore et achemine les renforts
function hitNode(f){for(let i=f.seg+1;i<f.path.length;i++){const n=G.nodes[f.path[i]];if(n.owner!==f.owner||i===f.path.length-1)return n;}return null;}
function ai(P){
  const cfg=G.cfg,st=STYLE[(G.style&&G.style[P])||"equilibre"],nodes=G.nodes,incoming={},danger={};
  for(const f of G.fleets){
    if(f.owner===P){incoming[f.dest]=(incoming[f.dest]||0)+f.ships;continue;}
    const h=hitNode(f);if(h&&h.owner===P)danger[h.id]=(danger[h.id]||0)+f.ships*(f.pow||1);
  }
  const mine=nodes.filter(n=>n.owner===P),avail={},threatOf={};
  for(const n of mine){let th=0;
    for(const e of G.adj[n.id]){const t=nodes[e.to];if(t.owner&&t.owner!==P)th=Math.max(th,t.ships*boostOf(t));}
    threatOf[n.id]=th;avail[n.id]=Math.max(0,n.ships*cfg.aggr*st.aggr-th*cfg.safety*st.safety);}
  // 1. défense : une étoile visée garde ses vaisseaux et appelle ses voisines à l'aide
  if(cfg.defend&&Math.random()<cfg.defend)for(const n of mine){
    const d=danger[n.id];if(!d)continue;
    let deficit=d-(n.ships*defMult(n)+n.wall+(incoming[n.id]||0)*defMult(n))+2;
    avail[n.id]=0;if(deficit<=0)continue;
    for(const e of G.adj[n.id].slice().sort((x,y)=>x.len-y.len)){const m=nodes[e.to];
      if(m.owner!==P||danger[m.id])continue;
      const give=Math.ceil(Math.min(avail[m.id],deficit/defMult(n)+1));if(give<2)continue;
      if(send(m,n,give)){avail[m.id]-=give;deficit-=give*defMult(n);incoming[n.id]=(incoming[n.id]||0)+give;}
      if(deficit<=0)break;}
  }
  // 2. attaques : la cible la plus rentable, en combinant jusqu'à maxSrc étoiles voisines
  const used=new Set();
  for(let round=0;round<4;round++){
    let best=null;
    for(const t of nodes){
      if(t.owner===P)continue;
      const srcs=G.adj[t.id].map(e=>({n:nodes[e.to],len:e.len})).filter(x=>x.n.owner===P&&avail[x.n.id]>=2)
        .sort((x,y)=>avail[y.n.id]-avail[x.n.id]).slice(0,cfg.maxSrc||1);
      if(!srcs.length)continue;
      const far=Math.max(...srcs.map(x=>x.len));
      const need=t.ships*defMult(t)+t.wall+(t.owner?rate(t)*far/FLEET_SPEED:0)+1-(incoming[t.id]||0);
      if(need<=0)continue;
      const margin=cfg.margin*st.margin,total=srcs.reduce((acc,x)=>acc+avail[x.n.id],0);
      if(total<need+margin)continue;
      let w=t.owner===1?st.hunt:t.owner?1:st.neutral;
      if(t.owner&&t.ships<8)w*=1.4; // étoile ennemie dégarnie : on en profite
      if(t.kind==="phare")w*=1.2;
      const score=(t.size+1)/Math.max(need,1)*w*(srcs.length>1?.9:1);
      if(!best||score>best.score)best={t,need:need+margin,srcs,score};
    }
    if(!best)break;
    let left=best.need;
    for(const x of best.srcs){const amt=Math.ceil(Math.min(avail[x.n.id],left));if(amt<1)continue;
      if(send(x.n,best.t,amt)){avail[x.n.id]-=amt;left-=amt;used.add(x.n.id);}if(left<=0)break;}
    incoming[best.t.id]=(incoming[best.t.id]||0)+best.need;
  }
  // 3. le reste : spécialisations, améliorations, renforts vers le front
  for(const n of mine){
    if(used.has(n.id))continue;
    const hostile=G.adj[n.id].some(e=>nodes[e.to].owner!==P);
    if(!hostile){
      if(!n.kind&&Math.random()<cfg.special&&n.ships>=SPECIAL_COST+8){const mates=G.adj[n.id].filter(e=>nodes[e.to].owner===P).length;if(upgrade(n,mates>=3&&Math.random()<.5?"phare":"rapide"))continue;}
      if(n.kind&&Math.random()<cfg.upg&&n.ships>=klvCost(n)+8&&upgrade(n,"klv"))continue;
      if(Math.random()<cfg.upg&&n.prod<3&&n.ships>=prodCost(n)+5){upgrade(n,"prod");continue;}
      if(n.ships>8){const t=frontier(n,P);if(t)send(n,t,n.ships*.85);}
      continue;
    }
    const threat=Math.max(threatOf[n.id],danger[n.id]||0);
    if(threat>0&&Math.random()<cfg.special*st.shield&&n.ships>=defCost(n)+threat*.3&&upgrade(n,"def"))continue;
    if(Math.random()<cfg.upg){
      if(threat>0&&n.def<3&&n.ships>=defCost(n)+threat*.6/st.safety)upgrade(n,"def");
      else if(n.prod<2&&n.ships>=prodCost(n)+15)upgrade(n,"prod");
    }
  }
}
function frontier(n,P){
  const q=[n.id],seen=new Set([n.id]);
  while(q.length){const u=q.shift(),un=G.nodes[u];
    if(u!==n.id&&G.adj[u].some(e=>G.nodes[e.to].owner!==P))return un;
    for(const e of G.adj[u])if(!seen.has(e.to)&&G.nodes[e.to].owner===P){seen.add(e.to);q.push(e.to);}}
  return null;
}

  document.querySelectorAll(".rb.pulse").forEach(b=>b.classList.remove("pulse"));if(s.btn)RB[s.btn].classList.add("pulse");
  $("tutoN").textContent=t("tuto_n",tuto.step+1,TUTO.length);$("tutoT").textContent=s.txt();
  $("tutoOk").hidden=!s.ok;if(s.ok)$("tutoOk").textContent=t(s.ok);$("tutoSkip").hidden=!!s.ok;}
function tutoTick(){const s=TUTO[tuto.step];if(s.done&&s.done())tutoNext();}
function tutoNext(){tuto.step++;sfx("tick");if(tuto.step>=TUTO.length)tutoEnd();else tutoShow();}
function tutoEnd(silent){const main=tuto&&tuto.main;tuto=null;if(main)store.set(main===2?"constella-tuto2":"constella-tuto-v2",true);$("tuto").hidden=true;layout();
  document.querySelectorAll(".rb.pulse").forEach(b=>b.classList.remove("pulse"));
  if(!silent&&G&&cur&&main)toast(null,t("your_turn"));}
// mini tutoriel guidé quand une nouvelle icône se débloque
const FEAT_TUTO={prod:1,def:1,rapide:1,phare:1};let pendingFeat=null;
function featTutoStart(k){
  const seen=store.get("constella-ftuto2",{});if(seen[k])return;seen[k]=1;store.set("constella-ftuto2",seen);
  const a=G.nodes.filter(n=>n.owner===1&&(k==="prod"||(k==="def"?n.kind!=="rapide":!n.kind))).sort((x,y)=>y.ships-x.ships)[0];if(!a)return;
  const cost=k==="prod"?prodCost(a):k==="def"?defCost(a):SPECIAL_COST;if(a.ships<cost+3)a.ships=cost+3;
  const snap=()=>[a.prod,a.def,a.kind].join(),s0=snap();
  TUTO=[{txt:()=>t("ft_tap"),hl:()=>[a.id],pause:1,only:()=>[a.id],done:()=>G.sel===a.id},
    {txt:()=>t("ft_"+k),pause:1,only:()=>[],btn:k,done:()=>snap()!==s0},
    {txt:()=>t("ft_after"),ok:"tuto_go",pause:1,only:()=>[]}];
  tuto={step:0,feat:k};$("toast").hidden=true;$("tuto").hidden=false;layout();tutoShow();
}
// aide toujours disponible : explication de chaque geste et de chaque icône débloquée
let helpOpen=false;
function openHelp(){helpRows($("helpL"),G&&!G.demo?U():FULL);$("help").hidden=false;helpOpen=true;$("helpL").scrollTop=0;}
function helpRows(L,u){const all=!u;u=u||FULL;const rows=[["tap",t("help_tap_t"),t("help_tap_d")],["drag",t("help_drag_t"),t("help_drag_d")+" "+t("help_auto_d")],["wall",t("help_wall_t"),t("help_wall_d")]];
  if(u.prod)rows.push(["prod",t("rb_prod"),t("help_prod_d")]);
  if(u.def)rows.push(["def",t("rb_def"),t("n_def1_d")]);
  if(u.rapide)rows.push(["rapide",t("n_rapide_t"),t("n_rapide_d")]);
  if(u.phare)rows.push(["phare",t("n_phare_t"),t("n_phare_d")]);
  if(u.klv>1)rows.push(["klv",t("rb_klv"),t("n_klv_d",u.klv)]);
  if(all||!G||G.demo||G.nodes.some(n=>n.size===2))rows.push(["t2",t("n_t2_t"),t("n_t2_d")]);
  if(all||!G||G.demo||G.nodes.some(n=>n.size===3))rows.push(["t3",t("n_t3_t"),t("n_t3_d")]);
  rows.push(["zoom",t("n_zoom_t"),t("n_zoom_d")]);
  L.innerHTML="";
  rows.forEach(([k,ti,d])=>{const row=document.createElement("div");row.className="ni";const ic=document.createElement("span");ic.className="rb k-"+k;ic.innerHTML=svgI(k);
    const tx=document.createElement("div");const b=document.createElement("b");b.textContent=ti;const sm=document.createElement("small");sm.textContent=d;tx.append(b,sm);row.append(ic,tx);L.appendChild(row);});
}
$("helpBtn").onclick=()=>{if(helpOpen){$("help").hidden=true;helpOpen=false;}else openHelp();};
$("helpOk").onclick=()=>{$("help").hidden=true;helpOpen=false;};
$("tutoOk").onclick=()=>{if(tuto)tutoNext();};
$("tutoSkip").onclick=()=>{if(tuto)tutoEnd();};
$("tutoAgain").onclick=()=>{closeSheet();startLevel(0,0,true);};

// Son et vibration
const SVG_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const SVG_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>';
function soundUi(){if($("mSnd"))$("mSnd").innerHTML=snd.on?SVG_ON:SVG_OFF;$("sndBtn").innerHTML=snd.on?SVG_ON:SVG_OFF;$("sndBtn").setAttribute("aria-pressed",String(snd.on));$("sndBtn").setAttribute("aria-label",snd.on?t("snd_off"):t("snd_on"));$("sndBtn").title=snd.on?t("snd_off"):t("snd_on");
  mark("optSnd","v",snd.on?1:0);mark("optVib","v",snd.vib?1:0);}
function setSound(v){snd.on=v;store.set("constella-son",v);if(v){audio();setTimeout(()=>{const d=G&&G.demo;if(d)G.demo=false;sfx("tick");if(d)G.demo=true;},30);}soundUi();}
$("sndBtn").onclick=()=>setSound(!snd.on);
$("fitBtn").onclick=()=>{resetView();$("fitBtn").hidden=true;};
segGroup("optSnd","v",v=>setSound(v==="1"));
segGroup("optVib","v",v=>{snd.vib=v==="1";store.set("constella-vibration",snd.vib);if(snd.vib&&navigator.vibrate)try{navigator.vibrate(25);}catch(e){}soundUi();});
soundUi();

// Langue : textes de l'interface, sens d'écriture (arabe de droite à gauche)
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.i18nAria));if(el.hasAttribute("title"))el.title=t(el.dataset.i18nAria);});
  document.querySelectorAll("#maps .map").forEach(b=>{b.querySelector("b").textContent=t("map_"+b.dataset.map+"_n");b.querySelector("small").textContent=t("map_"+b.dataset.map+"_d");});
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
  $("lang").setAttribute("aria-label",t("lang_h"));$("mLangL").textContent=lang==="ar"?"ع":lang.toUpperCase();
  campLabel();soundUi();if(!$("worlds").hidden)renderWorlds();if(tuto)tutoShow();if(G)refreshPanel();
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("constella-lang",lang);applyLang();});

// Démo en fond du menu : l'IA joue contre elle-même
function demo(){cur=null;G=buildFree("vega",DIFF.normal);G.demo=true;layout();}
demo();applyLang();

let last=performance.now(),hudT=0;
function loop(now){
  let dt=Math.min(.1,(now-last)/1000);last=now;
  if(G&&!G.over){
    let sim=G.demo?dt:(menuOpen||newsOpen||helpOpen||(tuto&&TUTO[tuto.step].pause)?0:dt*speed*PACE*(G.pace||1));
    if(tuto&&!G.demo)G.tutoT=(G.tutoT||0)+sim;
    while(sim>0){const s=Math.min(.05,sim);step(s);sim-=s;}
    if(tuto&&!menuOpen)tutoTick();
    if(G.demo&&G.over)demo();
  }
  draw();hudT+=dt;if(hudT>.2){hudT=0;scoreHud();if(G&&!G.demo)refreshPanel();$("fitBtn").hidden=!(G&&!G.demo&&!menuOpen&&VZ>1.01);}
  requestAnimationFrame(loop);
}
window.__constella={WORLDS,buildLevel,get G(){return G;},startLevel,ai,step};
window.addEventListener("resize",resize);resize();requestAnimationFrame(loop);
})();
</script>
