name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android

      - name: APK de test (à installer directement sur un téléphone)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: constella-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Bundle signé pour le Play Store (si la clé est configurée)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          # retire les espaces / retours à la ligne ajoutés par un copier-coller
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/constella.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/constella.jks"
          export ANDROID_KEYSTORE_PASSWORD="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          export ANDROID_KEY_PASSWORD="$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d ' \r\n\t')"
          export ANDROID_KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d ' \r\n\t')"
          echo "longueurs : mot de passe ${#ANDROID_KEYSTORE_PASSWORD}, alias ${#ANDROID_KEY_ALIAS}, fichier $(stat -c%s "$ANDROID_KEYSTORE_PATH") octets"
          ./gradlew bundleRelease
        # le fichier .aab est ensuite déposé dans la Play Console
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: constella-play-store-aab
          path: android/app/build/outputs/bundle/release/*.aab
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
